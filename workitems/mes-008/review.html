<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MES-008｜實圖比較</title><style>body{font:16px/1.7 'Segoe UI','Microsoft JhengHei',sans-serif;background:#f2f6fa;color:#15314e;margin:0}main{max-width:1200px;margin:auto;padding:25px}h1{font-size:28px}nav,.controls{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}button,a{font:inherit;color:#155daa}button{border:1px solid #bed0e2;background:white;border-radius:7px;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#155daa;color:white}figure{margin:0;padding:12px;background:white;border:1px solid #d1deeb;border-radius:12px}img{display:block;width:100%;height:auto}figure.phone{max-width:360px}figcaption{padding:10px;font-size:13px;color:#506b86}.note{border-left:4px solid #dca538;background:#fff4cc;padding:15px 20px}.links{display:flex;gap:20px}button:focus-visible,a:focus-visible{outline:3px solid #e4ab28;outline-offset:3px}@media(max-width:600px){main{padding:16px}}</style><main><h1>資料新鮮度：參考與新舊畫面</h1><p>第一課是使用者指出的較好參考。舊版高分已撤回；新版有逐圖退回與實際頁面檢查，尚未獲使用者驗收。</p><p class="links"><a href="../../freshness.html">開啟教學</a><a href="REVIEW.md">分項與修正紀錄</a></p><nav aria-label="選擇章節"><button data-chapter="architecture" aria-pressed="true">架構</button><button data-chapter="decision" aria-pressed="false">選擇原則</button><button data-chapter="ai" aria-pressed="false">AI案例</button><button data-chapter="history" aria-pressed="false">歷史與現在</button><button data-chapter="join" aria-pressed="false">同列時間差</button><button data-chapter="contract" aria-pressed="false">Data Contract</button></nav><div class="controls" role="group" aria-label="比較畫面"><button data-mode="desktop" aria-pressed="true">新版桌面主圖</button><button data-mode="mobile" aria-pressed="false">新版手機主圖</button><button data-mode="old" aria-pressed="false">上版完整頁</button><button data-mode="reference" aria-pressed="false">第一課參考</button></div><p class="note" id="caption"></p><figure id="figure"><img id="art" alt=""><figcaption id="file"></figcaption></figure></main><script>const data=[{"id": "architecture", "title": "架構", "desktop": "../../assets/freshness-v2/architecture-desktop-v3.png", "mobile": "../../assets/freshness-v2/architecture-mobile-v3.png", "old": "../../tests/evidence/mes-007/freshness-architecture-1440.png"}, {"id": "decision", "title": "選擇原則", "desktop": "../../assets/freshness-v2/decision-desktop-v2.png", "mobile": "../../assets/freshness-v2/decision-mobile-v2.png", "old": "../../tests/evidence/mes-007/freshness-decision-1440.png"}, {"id": "ai", "title": "AI案例", "desktop": "../../assets/freshness-v2/ai-desktop-v2.png", "mobile": "../../assets/freshness-v2/ai-mobile-v2.png", "old": "../../tests/evidence/mes-007/freshness-ai-1440.png"}, {"id": "history", "title": "歷史與現在", "desktop": "../../assets/freshness-v2/history-desktop-v3.png", "mobile": "../../assets/freshness-v2/history-mobile-v1.png", "old": "../../tests/evidence/mes-007/freshness-history-1440.png"}, {"id": "join", "title": "同列時間差", "desktop": "../../assets/freshness-v2/join-desktop-v2.png", "mobile": "../../assets/freshness-v2/join-mobile-v1.png", "old": "../../tests/evidence/mes-007/freshness-join-1440.png"}, {"id": "contract", "title": "Data Contract", "desktop": "../../assets/freshness-v2/contract-desktop-v1.png", "mobile": "../../assets/freshness-v2/contract-mobile-v1.png", "old": "../../tests/evidence/mes-007/freshness-contract-1440.png"}];let id='architecture',mode='desktop';function render(){const r=data.find(x=>x.id===id);const src=mode==='reference'?'../../examples/fab-physical-data-v01.png':r[mode];document.querySelector('#art').src=src;document.querySelector('#art').alt=r.title+'比較畫面';document.querySelector('#file').textContent=src;document.querySelector('#caption').textContent=mode==='reference'?'參考：設備→同載具局部→資料欄位，三者有可追蹤對應。':r.title+'｜'+({desktop:'新版主圖。原圖與實际頁面另有1440/800/360截圖。',mobile:'手機版以360px展示；必要標籤須直接可讀。',old:'MES-007歷史畫面。原始評分已撤回，不代表現在版本。'}[mode]);document.querySelector('#figure').classList.toggle('phone',mode==='mobile');document.querySelectorAll('[data-chapter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.chapter===id));document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));}document.addEventListener('click',e=>{if(e.target.dataset.chapter)id=e.target.dataset.chapter;if(e.target.dataset.mode)mode=e.target.dataset.mode;render();});render();</script></html>

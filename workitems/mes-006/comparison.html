<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第一課與十五頁互比</title><style>body{margin:0;background:#f3f6fa;color:#142a42;font:17px/1.65 system-ui,sans-serif}main{max-width:1600px;margin:auto;padding:28px}h1{font-size:30px}select{max-width:100%;padding:12px;font:inherit}section{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}figure{margin:0}img{width:100%;background:white;border:1px solid #cad9e5;border-radius:12px}article{background:white;border-left:4px solid #b06020;padding:18px;margin:24px 0}a{color:#155bb0}small{display:block}button{font:inherit;padding:8px 14px;margin:12px 8px 12px 0}@media(max-width:800px){section{grid-template-columns:1fr}main{padding:16px}}</style><main><a href="../../index.html#fab">回第一課</a><h1>有畫面，不等於有同等的教學品質</h1><p>第一課用實物、局部放大與定位線解釋資料；MES-004 多頁退回符號、欄位與文字。先前的「自評達標」已撤回。</p><label for="pick">比較頁面 </label><select id="pick"></select><div><button id="prev">上一頁</button><button id="next">下一頁</button><span id="count"></span></div><section><figure><h2>第一課：使用者指定參考</h2><a href="fab-scene.png" target="_blank"><img src="fab-scene.png" alt="設備上的 FOUP 經局部放大到 Slot 07，再連到 W07 資料欄位"></a><small>點圖開啟完整截圖。AI 生成教學示意。</small></figure><figure><h2 id="title"></h2><a id="link" target="_blank"><img id="candidate" alt="待比較的 MES-004 教學主圖"></a><small>目前啟用版本的桌面主圖，並非新重製成果。</small></figure></section><article><strong>具體落差</strong><p id="problem"></p><strong>應保留與改變</strong><p id="fix"></p></article><p>本頁是桌面視覺比較，非整批重驗；沒有用新分數掩蓋舊評分失準。<a href="COMPARISON.md">完整逐頁紀錄</a></p></main><script>const rows=[{"id": "operations/port", "problem": "槽位配對有用，但沒有實際 FOUP、Slot 局部與讀取位置；六個小圓符號主要在裝飾資料表。", "fix": "保留逐槽配對；用同一 FOUP 的 Slot 07 局部，連到 W07／W99 讀值差異。", "src": "../../tests/evidence/mes-004/operations-port-1440-scene.png"}, {"id": "operations/recipe", "problem": "三把鑰匙只出現在標題；主體實際是欄位與 Pass／Fail 清單，看不到設備、配方與批次的關係。", "fix": "同一批要求對照機台及已載入配方的具體交接畫面，突出不符的版本或能力。", "src": "../../tests/evidence/mes-004/operations-recipe-1440-scene.png"}, {"id": "operations/chamber", "problem": "FOUP 變成橫向長盒，腔體是扁橢圓；身分守恆成立，空間及設備辨識度很低。", "fix": "建立載具槽架→搬送位置→腔體的設備示意，切換時在相同位置追蹤 W06。", "src": "../../tests/evidence/mes-004/operations-chamber-1440-scene.png"}, {"id": "operations/state", "problem": "設備 Ready 與 Lot Hold 有分開，但橢圓與卡片仍須先讀文字才能知道角色。", "fix": "用可辨識機台與批次工作單對照，兩個 Hold 各有具名標籤及解除後可見的限制變化。", "src": "../../tests/evidence/mes-004/operations-state-1440-scene.png"}, {"id": "operations/handoff", "problem": "時間線有順序，但主體是逐行文字；W08 缺結果與機台 Done 的交接機制沒有具體接收方。", "fix": "機台完成畫面→三筆結果交接→MES 過站回覆，突出 W08 空缺及補齊前後。", "src": "../../tests/evidence/mes-004/operations-handoff-1440-scene.png"}, {"id": "operations/lab", "problem": "搬送被壓成三個節點，FOUP 是大空盒；可操作不代表看得見搬送現場。", "fix": "保留引擎，讓 F012 在 Stocker、OHT、Load Port 的具體空間位置移動，原始欄位放次層。", "src": "../../tests/evidence/mes-004/operations-lab-1440-scene.png"}, {"id": "flow/stage", "problem": "分組與 2/2、4/6 可讀，但準備／圖形／確認只有站名；新手仍不知道各段在做什麼。", "fix": "先用晶圓的準備、圖形加工、量測示意建立三段工作，再於各段展開 Step。", "src": "../../tests/evidence/mes-004/flow-stage-1440-scene.png"}, {"id": "flow/step", "problem": "重用 CLEAN 與 Visit 的區別成立，但 S10／R10 是兩张記錄卡；抽象術語先於工作情境。", "fix": "保留不同執行位置的證據，補同一清洗作業被兩個路徑位置呼叫的具體對照。", "src": "../../tests/evidence/mes-004/flow-step-1440-scene.png"}, {"id": "flow/lot-flow", "problem": "兩批獨立進度正確，但模板與實例靠 FlowRef 文字說明；小晶圓與路徑重複填充版面。", "fix": "固定上方完整路線作定義，兩批各自的旅程單及位置從同一版本連出，不混成實際搬送。", "src": "../../tests/evidence/mes-004/flow-lot-flow-1440-scene.png"}, {"id": "flow/execution", "problem": "Current 和 RunState 有變化，但初始主圖大片空白，只有站點、代碼和狀態字。", "fix": "把同一站的待加工、加工、結果交接與過站排成可見過程，指標與實際證據同步。", "src": "../../tests/evidence/mes-004/flow-execution-1440-scene.png"}, {"id": "flow/branching", "problem": "量尺確實顯示 100／105 的差異，值得保留；但量測值沒有工作含義，W08 圖示不提供量測證據。", "fix": "使用明確標為假設的可視量測特徵及單位，接上同一尺度的判定與三種去向。", "src": "../../tests/evidence/mes-004/flow-branching-1440-scene.png"}, {"id": "flow/rework", "problem": "回圈和兩次 Visit 的保留可見；相同 W08 符號沒有展示清洗前後，圖仍主要靠標籤講故事。", "fix": "保留歷程與核准返回點，使用可解釋的加工前後示意；不能虛構重工必然改善。", "src": "../../tests/evidence/mes-004/flow-rework-1440-scene.png"}, {"id": "flow/split-merge", "problem": "這頁的 3→2+1 與進度不符已有可見資料關係，比其他頁完整；但符號質感與合批結果仍不足。", "fix": "保留譜系圖，明示批次管理分組與物理載具不同，補合批前後成員與歷程的對照。", "src": "../../tests/evidence/mes-004/flow-split-merge-1440-scene.png"}, {"id": "flow/versions", "problem": "v2 插入 S45 是可见差異；但版本定義、遷移批准與兩個時點擠在同一長圖，閱讀靠註解。", "fix": "用對齊的版本差異圖突出插站，再局部展開 L023 遷移前後位置與批准紀錄。", "src": "../../tests/evidence/mes-004/flow-versions-1440-scene.png"}, {"id": "flow/lab", "problem": "初始圖是產品文字框、Lot 卡與三個小圓；已有的情境狀態機被當成教學主視覺。", "fix": "保留操作規則，改成帶具體任務、變化證據與結果的旅程場景，資料記錄作第二層。", "src": "../../tests/evidence/mes-004/flow-lab-1440-scene.png"}];const pick=document.querySelector('#pick');rows.forEach((r,i)=>pick.add(new Option(r.id,i)));function show(){const r=rows[Number(pick.value)];document.querySelector('#title').textContent=r.id;document.querySelector('#candidate').src=r.src;document.querySelector('#link').href=r.src;document.querySelector('#problem').textContent=r.problem;document.querySelector('#fix').textContent=r.fix;document.querySelector('#count').textContent=(Number(pick.value)+1)+' / 15';document.querySelector('#prev').disabled=pick.value==='0';document.querySelector('#next').disabled=pick.value==='14';}pick.onchange=show;document.querySelector('#prev').onclick=()=>{pick.value=Number(pick.value)-1;show()};document.querySelector('#next').onclick=()=>{pick.value=Number(pick.value)+1;show()};show();</script></html>

<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ER 原圖與 SVG 重畫</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172e43;font:16px "Microsoft JhengHei",sans-serif}header{padding:20px 24px;background:white;border-bottom:1px solid #cbd7e1}h1{font-size:23px;margin:0 0 12px}nav,.tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,a{font:inherit}button{border:1px solid #a9bdce;background:white;color:#153e65;border-radius:5px;padding:8px 13px;cursor:pointer}button[aria-current=true]{background:#176aa8;color:white}a{color:#1266a6}.tools{margin-top:14px}p{line-height:1.7;margin:12px 0 0}.workspace{padding:20px;display:grid;grid-template-columns:1fr;gap:18px}.workspace.compare{grid-template-columns:1fr 1fr}section{background:white;border:1px solid #cad7e3;min-width:0}h2{font-size:17px;margin:0;padding:13px;border-bottom:1px solid #dae3eb}.viewport{height:calc(100vh - 270px);min-height:460px;overflow:auto}object{display:block;max-width:none}#original{display:block;width:100%;height:auto}#photo[hidden]{display:none}.notice{color:#975600;font-size:14px}@media(max-width:800px){.workspace.compare{grid-template-columns:1fr}.viewport{height:65vh}header{padding:15px}.workspace{padding:10px}}</style></head>
<body><header><a href="../../data-map.html">← 回到資料與物理意義教學</a><h1>ER 原圖 → SVG 重畫</h1><nav id="tabs" aria-label="圖號"></nav><div class="tools"><button id="fit">符合寬度</button><button id="minus" aria-label="縮小">−</button><output id="zoom">100%</output><button id="plus" aria-label="放大">＋</button><button id="toggle" aria-pressed="false">對照原照片</button><a id="download" download>下載 SVG</a><a href="UNCLEAR_TEXT.md">文字確認紀錄</a></div><p class="notice">原圖疑義文字已全部確認並套用；保留原圖關係。</p></header>
<main class="workspace" id="workspace"><section><h2 id="name"></h2><div class="viewport" id="canvas"><object id="drawing" type="image/svg+xml" aria-label="SVG 關係圖"></object></div></section><section id="photo" hidden><h2>原始照片（未修改）</h2><div class="viewport"><img id="original" alt="原始 ER 圖照片"></div></section></main>
<script>const names={'2671':'LOT、FOUP、Port 與機台','2672':'歷史、Qtime 與搬送','2673':'Flow、Part 與 LR','2674':'設備、Chamber 與 OHB','2675':'WIP、機群與 OEE','2676':'設備與 LOT 簡圖','2677':'PD、ER 與設備'};const widths={'2671':1800,'2672':2800,'2673':2800,'2674':2400,'2675':2900,'2676':1480,'2677':2080};let id='2671',scale=1;const $=s=>document.getElementById(s);function resize(){ $('drawing').style.width=Math.round(widths[id]*scale)+'px';$('zoom').value=Math.round(scale*100)+'%'}function fit(){scale=($('canvas').clientWidth-2)/widths[id];resize()}function show(){id=names[location.hash.slice(1)]?location.hash.slice(1):'2671';$('drawing').data=id+'.svg';$('original').src='../ORG/'+id+'.jpg';$('download').href=id+'.svg';$('name').textContent=id+' · '+names[id];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));fit()}for(const [n,title]of Object.entries(names)){const b=document.createElement('button');b.textContent=n;b.title=title;b.dataset.id=n;b.onclick=()=>location.hash=n;$('tabs').append(b)}$('fit').onclick=fit;$('minus').onclick=()=>{scale=Math.max(.2,scale/1.25);resize()};$('plus').onclick=()=>{scale=Math.min(3,scale*1.25);resize()};$('toggle').onclick=()=>{const visible=$('photo').hidden;$('photo').hidden=!visible;$('workspace').classList.toggle('compare',visible);$('toggle').setAttribute('aria-pressed',visible);fit()};addEventListener('hashchange',show);addEventListener('resize',fit);show();</script></body></html>
